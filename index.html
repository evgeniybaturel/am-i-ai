<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Not a Human - Draw</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">



<!-- =========================
START
========================= -->


<section id="start-screen">


<h1>
Not a Human
</h1>


<p class="subtitle">
Нарисуй как человек.<br>
Или обмани всех, что ты человек.
</p>





<div class="card">


<button 
class="btn"
id="create-room-btn">

🎨 Создать комнату

</button>



</div>






<div class="card">


<input

id="room-input"

placeholder="Код комнаты"

maxlength="6"

>


<button

class="btn secondary"

id="join-room-btn">

🔗 Войти

</button>


</div>



</section>









<!-- =========================
LOBBY
========================= -->


<section 
id="lobby-screen"
class="hidden">


<h2>
Комната
</h2>



<div class="experiment-box">


<strong id="room-display">

</strong>


</div>





<div id="created-room"
class="room-code">


</div>






<div class="waiting">


⏳ Ожидание игрока...

</div>






<button

class="btn secondary"

id="leave-room-btn">

🚪 Выйти из комнаты

</button>



</section>









<!-- =========================
DRAW
========================= -->


<section

id="draw-screen"

class="hidden">



<h2>
Нарисуй это:
</h2>





<div

class="task-card">


<p id="task-text">

Загрузка задания...

</p>


</div>






<div class="canvas-wrapper">


<canvas

id="drawing-canvas"

width="350"

height="350">

</canvas>


</div>







<div class="draw-buttons">



<button

class="btn secondary"

id="clear-canvas-btn">

🗑 Очистить

</button>





<button

class="btn"

id="send-drawing-btn">

✅ Готово

</button>



</div>






<div

id="draw-status"

class="waiting hidden">

Ожидаем второго игрока...

</div>



</section>









<!-- =========================
WAIT
========================= -->


<section

id="wait-screen"

class="hidden">


<h2>

Готово!

</h2>



<div class="waiting">

Ждём второго игрока...

</div>


</section>









<!-- =========================
VOTE
========================= -->


<section

id="vote-screen"

class="hidden">



<h2>

Кто настоящий человек?

</h2>



<p class="hint">

Выберите рисунок ИИ

</p>






<div

id="images-container"

class="images-container">

</div>



</section>









<!-- =========================
RESULT
========================= -->


<section

id="result-screen"

class="hidden">



<h1>

Эксперимент завершён

</h1>




<div

class="result-card"

id="result-text">


</div>





<button

class="btn"

onclick="location.reload()">

Новый эксперимент

</button>




</section>








</div>









<!-- FIREBASE -->


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>





<!-- FILES -->


<script src="firebase.js"></script>

<script src="api.js"></script>

<script src="room.js"></script>

<script src="canvas.js"></script>

<script src="game.js"></script>

<script src="ui.js"></script>



</body>

</html>
